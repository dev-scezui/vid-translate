<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Video Translate</title>
<style>
  :root { color-scheme: light dark; --fg:#1a1a1a; --bg:#fafafa; --muted:#666; --card:#fff; --border:#ddd; --accent:#2457d6; }
  @media (prefers-color-scheme: dark) { :root { --fg:#eee; --bg:#121212; --muted:#999; --card:#1d1d1d; --border:#333; --accent:#7aa2ff; } }
  body { margin:0; font:16px/1.5 system-ui, sans-serif; color:var(--fg); background:var(--bg); }
  main { max-width:760px; margin:0 auto; padding:32px 16px; }
  [hidden] { display:none !important; }
  form { display:flex; flex-wrap:wrap; gap:8px; }
  input, button { font:inherit; padding:10px 12px; border:1px solid var(--border); border-radius:8px; background:var(--card); color:var(--fg); }
  input[name=url] { flex:1 1 320px; } input[name=lang] { width:140px; }
  button { background:var(--accent); color:#fff; border:none; cursor:pointer; } button:disabled { opacity:.6; }
  .status { color:var(--muted); margin:16px 0; }
  section { background:var(--card); border:1px solid var(--border); border-radius:10px; padding:16px; margin-top:16px; white-space:pre-wrap; }
  .plans { display:grid; grid-template-columns:repeat(auto-fit, minmax(190px, 1fr)); gap:12px; margin:16px 0; }
  .plan { background:var(--card); border:1px solid var(--border); border-radius:10px; padding:14px; white-space:normal; margin:0; }
  .plan.current { border-color:var(--accent); }
  .plan b { display:block; font-size:18px; } .plan .price { font-size:20px; margin:4px 0; } .plan ul { padding-left:18px; margin:8px 0; color:var(--muted); font-size:14px; }
  .plan button { width:100%; }
  .notice { padding:10px 12px; border-radius:8px; background:var(--card); border:1px solid var(--accent); }
  h2 { font-size:14px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); margin:0 0 8px; }
</style>
</head>
<body>
<main>
  <h1>Video Translate</h1>
  <p class="status">Paste a public link from TikTok, YouTube, Instagram, Facebook, Threads, X and more.</p>
  <p class="notice" id="notice" hidden></p>
  <div id="account" class="status"></div>
  <div class="plans" id="plans" hidden></div>
  <form id="signup" hidden>
    <input name="email" type="email" placeholder="you@example.com" required>
    <button>Get free API key</button>
    <input name="key" placeholder="…or paste an existing key" aria-label="API key">
  </form>
  <form id="f" hidden>
    <input name="url" type="url" placeholder="https://..." required>
    <input name="lang" value="English" aria-label="Target language">
    <button>Translate</button>
  </form>
  <p class="status" id="status"></p>
  <div id="out"></div>
</main>
<script>
const KEY = "vt_api_key";
const store = { get() { try { return localStorage.getItem(KEY); } catch { return null; } },
                set(v) { try { v ? localStorage.setItem(KEY, v) : localStorage.removeItem(KEY); } catch {} } };
let apiKey = store.get();
const accountEl = document.getElementById("account"), signup = document.getElementById("signup");
const auth = () => ({ Authorization: "Bearer " + apiKey });
const plansEl = document.getElementById("plans"), noticeEl = document.getElementById("notice");
let currentUsage = null;
function smallButton(label, onclick) { const b = document.createElement("button"); b.textContent = label; b.style.padding = "2px 8px"; b.style.marginLeft = "6px"; b.onclick = onclick; return b; }
async function goTo(endpoint, body) {
  const r = await fetch(endpoint, { method: "POST", headers: { "Content-Type": "application/json", ...auth() }, body: JSON.stringify(body ?? {}) });
  const j = await r.json(); if (!r.ok) { alert(j.error); return; }
  location.href = j.url;
}
function showUsage(u) {
  currentUsage = u;
  const sub = u.subscription;
  let line = `${u.planName} plan · ${u.remaining}/${u.monthlyTranslations} translations left this month · videos up to ${Math.round(u.maxVideoSec / 60)} min`;
  if (sub?.cancelAtPeriodEnd && sub.currentPeriodEnd) line += ` · ends ${new Date(sub.currentPeriodEnd).toLocaleDateString()}`;
  if (sub?.status === "past_due") line += " · payment failed, please update your card";
  accountEl.textContent = line + " ";
  if (sub) accountEl.append(smallButton("Manage billing", () => goTo("/api/billing/portal")));
  accountEl.append(smallButton("Sign out", () => { store.set(null); apiKey = null; refresh(); }));
  renderPlans();
}
let plans = [];
function fmtPrice(p) {
  if (!p) return "Free";
  return new Intl.NumberFormat(undefined, { style: "currency", currency: p.currency }).format(p.amount / 100) + (p.interval ? " / " + p.interval : "");
}
function renderPlans() {
  plansEl.innerHTML = ""; plansEl.hidden = !apiKey || !plans.length;
  const subscribed = ["active", "trialing", "past_due"].includes(currentUsage?.subscription?.status);
  for (const p of plans) {
    const card = document.createElement("section"); card.className = "plan" + (currentUsage?.plan === p.id ? " current" : "");
    const name = document.createElement("b"); name.textContent = p.name;
    const price = document.createElement("div"); price.className = "price"; price.textContent = p.price ? fmtPrice(p.price) : (p.purchasable ? "" : "Free");
    const ul = document.createElement("ul");
    for (const t of [`${p.monthly_translations} translations / month`, `Videos up to ${Math.round(p.max_video_sec / 60)} min`]) { const li = document.createElement("li"); li.textContent = t; ul.append(li); }
    card.append(name, price, ul);
    if (currentUsage?.plan === p.id) { const b = document.createElement("button"); b.textContent = "Current plan"; b.disabled = true; card.append(b); }
    else if (p.purchasable) {
      const b = document.createElement("button"); b.textContent = subscribed ? "Switch plan" : "Upgrade";
      b.onclick = () => subscribed ? goTo("/api/billing/portal") : goTo("/api/billing/checkout", { plan: p.id });
      card.append(b);
    }
    plansEl.append(card);
  }
}
const params = new URLSearchParams(location.search);
if (params.get("checkout")) {
  noticeEl.hidden = false;
  noticeEl.textContent = params.get("checkout") === "success" ? "Thanks! Your plan is being activated. It can take a few seconds to show up." : "Checkout cancelled. You haven't been charged.";
  history.replaceState(null, "", location.pathname);
  if (params.get("checkout") === "success") setTimeout(refresh, 4000);
}
fetch("/api/plans").then((r) => r.ok ? r.json() : []).then((p) => { plans = p; renderPlans(); }).catch(() => {});
async function refresh() {
  if (apiKey) {
    const r = await fetch("/api/me", { headers: auth() });
    if (r.ok) { showUsage((await r.json()).usage); signup.hidden = true; f.hidden = false; return; }
    store.set(null); apiKey = null;
  }
  accountEl.textContent = "Sign up for a free key to start translating."; signup.hidden = false; f.hidden = true; plansEl.hidden = true;
}
signup.onsubmit = async (e) => {
  e.preventDefault();
  if (signup.key.value.trim()) { apiKey = signup.key.value.trim(); }
  else {
    const r = await fetch("/api/signup", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ email: signup.email.value }) });
    const j = await r.json(); if (!r.ok) { accountEl.textContent = "Error: " + j.error; return; }
    apiKey = j.apiKey; alert("Your API key (also saved in this browser):\n\n" + apiKey);
  }
  store.set(apiKey); refresh();
};
signup.email.required = false;
const f = document.getElementById("f"), statusEl = document.getElementById("status"), out = document.getElementById("out");
const labels = { queued:"Queued…", fetching_info:"Reading link…", downloading:"Downloading…", extracting_audio:"Extracting audio…", transcribing:"Transcribing…", translating:"Translating…" };
function card(title, text) { const s = document.createElement("section"); const h = document.createElement("h2"); h.textContent = title; s.append(h, text); return s; }
f.onsubmit = async (e) => {
  e.preventDefault(); out.innerHTML = ""; f.querySelector("button").disabled = true;
  try {
    let r = await fetch("/api/jobs", { method:"POST", headers:{ "Content-Type":"application/json", ...auth() }, body: JSON.stringify({ url: f.url.value, targetLanguage: f.lang.value }) });
    let job = await r.json(); if (!r.ok) throw new Error(job.error);
    if (job.usage) showUsage(job.usage);
    while (!["done","error"].includes(job.status)) {
      statusEl.textContent = labels[job.status] ?? job.status;
      await new Promise((res) => setTimeout(res, 2000));
      job = await (await fetch("/api/jobs/" + job.id, { headers: auth() })).json();
    }
    if (job.status === "error") throw new Error(job.error);
    statusEl.textContent = job.video?.title ?? "Done";
    out.append(card("Translation (" + job.translation.language + ")", job.translation.text),
               card("Original transcript" + (job.transcript.language ? " (" + job.transcript.language + ")" : ""), job.transcript.text));
  } catch (err) { statusEl.textContent = "Error: " + err.message; }
  finally { f.querySelector("button").disabled = false; refresh(); }
};
refresh();
</script>
</body>
</html>
