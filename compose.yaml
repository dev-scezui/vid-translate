# The app on its own. Transcription goes to Groq by default (GROQ_API_KEY in .env).
#
#   docker compose up --build
#
# To transcribe on your own machine with a self-hosted Whisper server instead:
#
#   docker compose -f compose.yaml -f compose.whisper.yaml up --build
#   (with an NVIDIA GPU, add: -f compose.whisper-gpu.yaml)

services:
  app:
    build: .
    env_file:
      - path: .env
        required: true
    environment:
      PORT: "3000"
    ports:
      - "${APP_PORT:-3000}:3000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
